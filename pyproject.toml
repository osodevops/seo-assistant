[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-growth-assistant"
version = "0.1.0"
description = "A measured SEO improvement loop for Kafka Streamyard"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "google-analytics-data==0.18.19",
  "google-api-python-client==2.176.0",
  "google-auth==2.40.3",
  "openai==1.97.1",
  "python-dotenv==1.1.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.1"]

[project.scripts]
seo-growth = "seo_growth.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seo_growth = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
